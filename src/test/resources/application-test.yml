spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  cache:
    type: simple  # 테스트 환경에서는 간단한 메모리 캐시 사용

cache:
  default-ttl: 30
  like-count-ttl: 10

jwt:
  secret: test-secret-key-test-secret-key-123456
  expiration: 3600000
